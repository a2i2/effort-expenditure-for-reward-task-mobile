<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1.0"/>
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>mobile study</title>
        <link rel="shortcut icon" href="./src/assets/imgs/favicon.ico" />

        <style>
            html,
            body,

            #game-container {
                margin: 0;
                padding: 0;
                font: caption;
                font-weight: 500;
                min-width: 100vw;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #game-container > canvas {
                display: block;
                margin: 0;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                }

            .debug-menu {
                position: fixed;
                top: 10px;
                left: 10px;
                z-index: 1000;
            }

            .debug-menu select {
                padding: 8px;
                border-radius: 4px;
                background-color: #333;
                color: white;
                border: 1px solid #666;
            }

            .debug-menu select option {
                background-color: #333;
                color: white;
                padding: 8px;
            }
        </style>

    </head>

    <body>
        <!-- Game content -->
        <div id='game-container'></div>

        <!-- Debug Menu -->
        <div class="debug-menu">
            <select id="debugActions" onchange="handleDebugAction(this.value)">
                <option value="">Debug Actions</option>
                <option value="breakOver">Trigger Break Over Event</option>
            </select>
        </div>

        <!-- NB newer phaser3 versions are available but not compatible with this version of rexUI -->
        <script src="./src/phaser.js"></script>
        <script src="./src/ui/rexuiplugin.min.js" type="text/javascript"></script>

        <!-- Embed-Context used to communicate with native Android and iOS apps -->
        <script src="./src/embedContext/embedContext.js"></script>

        <!-- Main study components -->
        <script src="./src/saveData.js" type="module"></script>    <!-- set up data saving functions -->
        <script src="./src/versionInfo.js" type="module"></script>  <!-- set up task version info vars -->
        <script src="./src/info.js" type="module"></script> <!-- display info page -->
        <script src="./src/task.js" type="module"></script>         <!-- run task! -->

        <script nomodule>
            alert(
                "This browser doesn't support modules, so the study can't run. Please try the latest version of Chrome, Firefox or Safari!"
            );
        </script>

        <script type="module">
            import eventsCenter from './src/eventsCenter.js';
            window.breakOver = function() {
                eventsCenter.emit('breakover');
            };
        </script>

        <script>
            function handleDebugAction(action) {
                switch(action) {
                    case 'breakOver':
                        window.breakOver();
                        break;
                }
                document.getElementById('debugActions').value = '';
            }
        </script>
    </body>
</html>
