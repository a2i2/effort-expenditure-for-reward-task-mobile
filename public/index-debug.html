<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />

        <style>
            html,
            body {
                background-color: #CFEFFC;
                margin: 0;
                padding: 0;
                height: 100%;
            }

            #game-container {
                margin: 0;
                padding: 0;
                font: caption;
                font-weight: 500;
                min-width: 100vw;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }

            #game-container > canvas {
                display: block;
                position: absolute;
                bottom: 0;
            }

            .debug-menu {
                position: fixed;
                top: 10px;
                left: 10px;
                z-index: 1000;
            }

            .debug-menu select {
                padding: 8px;
                border-radius: 4px;
                background-color: #333;
                color: white;
                border: 1px solid #666;
            }

            .debug-menu select option {
                background-color: #333;
                color: white;
                padding: 8px;
            }
        </style>

    </head>

    <body>
        <!-- Game content -->
        <div id='game-container'></div>

        <!-- Debug Menu -->
        <div class="debug-menu">
            <select id="debugActions" onchange="handleDebugAction(this.value)">
                <option value="">Debug Actions</option>
                <option value="breakOver">Trigger Break Over Event</option>
            </select>
        </div>

        <!-- NB newer phaser3 versions are available but not compatible with this version of rexUI -->
        <script src="./src/phaser.min.js"></script>
        <script src="./src/ui/rexuiplugin.min.js" type="text/javascript"></script>

        <!-- Embed-Context used to communicate with native Android and iOS apps -->
        <script src="./src/embedContext/embedContext.js"></script>

        <!-- Main study components -->
        <script type="module">
            import GameCache from './src/embedContext/GameCache.js'
            import { runTask } from "./src/task.js";

            // Initiate the game, no longer need to rely info.js
            runTask();

            window.setupGameWithCache = function(gameCache) {
                GameCache.cache = gameCache;
            };
        </script>

        <script>
            function handleDebugAction(action) {
                switch(action) {
                    case 'breakOver':
                        window.breakOver();
                        break;
                }
                document.getElementById('debugActions').value = '';
            }
        </script>
    </body>
</html>
