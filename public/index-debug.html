<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1.0"/>
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />

        <style>
            html,
            body {
                background-color: #CFEFFC;
                margin: 0;
            }

            #game-container {
                margin: 0;
                padding: 0;
                font: caption;
                font-weight: 500;
                min-width: 100vw;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #game-container > canvas {
                display: block;
                margin: 0;
                position: absolute;
                bottom: 0;
            }

            /* Phaser is generating an empty div with annoying layout styling causing
               additional 'padding' in the window allow the user to scroll. By setting
               display to 'none' we hide it, but it can still be interacted with if
               that is important to Phaser. I've manually deleted the element within
               the browser and saw no difference in behaviour, so no idea why it's
               being generated. */
            #game-container > div {
                display: none !important;
            }

            .debug-menu {
                position: fixed;
                top: 10px;
                left: 10px;
                z-index: 1000;
            }

            .debug-menu select {
                padding: 8px;
                border-radius: 4px;
                background-color: #333;
                color: white;
                border: 1px solid #666;
            }

            .debug-menu select option {
                background-color: #333;
                color: white;
                padding: 8px;
            }
        </style>

    </head>

    <body>
        <!-- Game content -->
        <div id='game-container'></div>

        <!-- Debug Menu -->
        <div class="debug-menu">
            <select id="debugActions" onchange="handleDebugAction(this.value)">
                <option value="">Debug Actions</option>
                <option value="breakOver">Trigger Break Over Event</option>
            </select>
        </div>

        <!-- NB newer phaser3 versions are available but not compatible with this version of rexUI -->
        <script src="./src/phaser.min.js"></script>
        <script src="./src/ui/rexuiplugin.min.js" type="text/javascript"></script>

        <!-- Embed-Context used to communicate with native Android and iOS apps -->
        <script src="./src/embedContext/embedContext.js"></script>

        <!-- Main study components -->
        <script type="module">
            import eventsCenter from './src/eventsCenter.js';
            import { runTask } from "./src/task.js";

            // Initiate the game 
            runTask();

            window.breakOver = function() {
                eventsCenter.emit('breakover');
            };
        </script>

        <script>
            function handleDebugAction(action) {
                switch(action) {
                    case 'breakOver':
                        window.breakOver();
                        break;
                }
                document.getElementById('debugActions').value = '';
            }
        </script>
    </body>
</html>
