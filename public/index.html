<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />

        <style>
            @font-face {
                font-family: 'DMSans';
                src: url('src/assets/fonts/DMSans-Regular.ttf');
            }

            html,
            body {
                background-color: #CFEFFC;
                margin: 0;
                padding: 0;
                height: 100%;
            }

            #game-container {
                margin: 0;
                padding: 0;
                font: caption;
                font-weight: 500;
                min-width: 100vw;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }

            #game-container > canvas {
                display: block;
                position: absolute;
                bottom: 0;
            }
        </style>

    </head>

    <body>
        <!-- Game content -->
        <div id='game-container'></div>

        <!-- NB newer phaser3 versions are available but not compatible with this version of rexUI -->
        <script src="./src/phaser.min.js"></script>
        <script src="./src/ui/rexuiplugin.min.js" type="text/javascript"></script>

        <!-- Embed-Context used to communicate with native Android and iOS apps -->
        <script src="./src/embedContext/embedContext.js"></script>

        <!-- Main study components -->
        <script type="module">
            import eventsCenter from './src/eventsCenter.js';
            import { runTask } from "./src/task.js";

            // Initiate the game, no longer need to rely info.js
            runTask();

            window.breakOver = function() {
                eventsCenter.emit('breakover');
            };
        </script>

        <script nomodule>
            alert(
                "This browser doesn't support modules, so the study can't run. Please try the latest version of Chrome, Firefox or Safari!"
            );
        </script>
    </body>
</html>
