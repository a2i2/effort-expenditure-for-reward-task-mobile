name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'public/package-lock.json'

      - name: Clean dependencies
        working-directory: ./public
        run: |
          rm -rf node_modules
          rm -f package-lock.json

      - name: Install dependencies
        working-directory: ./public
        run: npm install

      - name: Build
        working-directory: ./public
        run: npm run build

      - name: Rename original index.html
        working-directory: ./public
        run: mv dist/index.html dist/index-og.html

      - name: Prepare index-frame.html
        working-directory: ./public
        run: |
          sed -e 's/src="index.html"/src="index-og.html"/' \
              -e 's/iframe.src = .index.html.;/iframe.src = "index-og.html";/' \
              index-frame.html > index-frame-deploy.html

      - name: Copy files to dist
        working-directory: ./public
        run: |
          cp index-frame-deploy.html dist/index.html
          cp devices.min.css dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 